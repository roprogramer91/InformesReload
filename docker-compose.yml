services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-informes_reload_dev}
      POSTGRES_USER: ${POSTGRES_USER:-informesreload}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-informesreload_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - informes_reload_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  informes_reload_postgres_data:
